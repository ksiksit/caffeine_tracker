<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .ios {
      font-family: -apple-system, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .rounded { font-family: "SF Pro Rounded", ui-rounded, -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .scroll { overflow-y: auto; min-height: 0; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }
    a { color: #8B5E3C; text-decoration: none; }
    a:hover { color: #6E4A2F; }
  </style>
</helmet>

<div class="ios" style="width: 402px; height: 874px; background: #F2F2F7; color: #000000; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <!-- 상태바 안전 영역 (실기기에서 시스템이 그림) -->
  <div style="height: 62px; flex-shrink: 0;"></div>

  <!-- 네비게이션 large title -->
  <div style="padding: 4px 16px 7px; flex-shrink: 0;">
    <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 41px;">홈</div>
  </div>

  <!-- 스크롤 본문 -->
  <div class="scroll" style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box;">

    <!-- 신호등 hero -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0;">
      <div style="font-size: 15px; font-weight: 600; color: rgba(60,60,67,0.6);">오늘의 카페인</div>

      <div style="perspective: 900px; margin: 4px 0;">
        <div role="button" tabindex="0" onClick="{{ toggleFlip }}" style="width: 240px; height: 240px; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.32, 0.72, 0, 1); transform: {{ discFlip }};">
          <div style="position: absolute; inset: 0; border-radius: 120px; background: {{ discBg }}; box-shadow: {{ discGlow }};"></div>
          <div style="position: absolute; inset: 0; border-radius: 120px; background: #000000; opacity: {{ dimOpacity }}; transition: opacity 0.55s;"></div>

          <!-- 앞면 -->
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 36px; opacity: {{ frontOpacity }}; transition: opacity 0.3s;">
            <sc-if value="{{ isCheck }}" hint-placeholder-val="{{ true }}">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.8 9.6 17.8 19.5 6.6"/></svg>
            </sc-if>
            <sc-if value="{{ isBang }}" hint-placeholder-val="{{ false }}">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M10.6 4.2h2.8l-.5 10h-1.8Z"/><circle cx="12" cy="18.6" r="1.6"/></svg>
            </sc-if>
            <sc-if value="{{ isX }}" hint-placeholder-val="{{ false }}">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg>
            </sc-if>
            <div class="rounded" style="font-size: {{ primarySize }}; font-weight: 700; color: #FFFFFF; white-space: nowrap;">{{ primary }}</div>
          </div>

          <!-- 뒷면 -->
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 40px; transform: rotateY(180deg); opacity: {{ backOpacity }}; transition: opacity 0.3s;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
              <div style="font-size: 12px; color: rgba(255,255,255,0.7);">잔류량</div>
              <div class="rounded" style="font-size: 20px; font-weight: 700; color: #FFFFFF;">{{ residual }}</div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
              <div style="font-size: 12px; color: rgba(255,255,255,0.7);">취침 예상</div>
              <div class="rounded" style="font-size: 20px; font-weight: 700; color: #FFFFFF;">{{ predicted }}</div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
              <div style="font-size: 12px; color: rgba(255,255,255,0.7);">총 섭취</div>
              <div class="rounded" style="font-size: 20px; font-weight: 700; color: #FFFFFF;">{{ total }}</div>
            </div>
          </div>
        </div>
      </div>

      <div style="font-size: 15px; color: rgba(60,60,67,0.6); text-align: center;">{{ caption }}</div>
      <div style="font-size: 12px; color: rgba(60,60,67,0.3);">탭하여 상세 정보</div>

    var chartOpen = !!st.chartOpen;
    var self = this;

    // 상태별 숫자는 모두 앱 공식(반감기 5.0h · 취침 23:00 · 안전선 50mg)으로 계산한 값.
    var SIG = {
      '지금 OK': {
        top: '#4FD467', bottom: '#29B84C', glow: 'rgba(52,199,89,0.5)', mark: 'check',
        primary: '지금 OK', size: '34px', caption: '취침까지 40 mg 한 잔 OK',
        residual: '21 mg', predicted: '5 mg', total: '30 / 400 mg'
      },
      '마감 시각': {
        top: '#4FD467', bottom: '#29B84C', glow: 'rgba(52,199,89,0.5)', mark: 'check',
        primary: '오후 3:20', size: '40px', caption: '이 시각까지 75 mg 한 잔 OK',
        residual: '96 mg', predicted: '24 mg', total: '180 / 400 mg'
      },
      '곧 마감': {
        top: '#FFAA2B', bottom: '#F08800', glow: 'rgba(255,149,0,0.5)', mark: 'bang',
        primary: '오후 3:20', size: '40px', caption: '곧 마감 — 지금이 마지막 75 mg 한 잔',
        residual: '83 mg', predicted: '24 mg', total: '180 / 400 mg'
      },
      '지금은 패스': {
        top: '#FF5A50', bottom: '#F02A1E', glow: 'rgba(255,59,48,0.5)', mark: 'x',
        primary: '지금은 패스', size: '34px', caption: '카페인 마감 시각이 지났어요',
        residual: '59 mg', predicted: '24 mg', total: '180 / 400 mg'
      },
      '오늘은 NO': {
        top: '#FF5A50', bottom: '#F02A1E', glow: 'rgba(255,59,48,0.5)', mark: 'x',
        primary: '오늘은 NO', size: '34px', caption: '취침 시 예상 74 mg',
        residual: '194 mg', predicted: '74 mg', total: '330 / 400 mg'
      }
    };
    var s = SIG[props.signal] || SIG['마감 시각'];

    return {
      discBg: 'linear-gradient(180deg, ' + s.top + ' 0%, ' + s.bottom + ' 100%)',
      discGlow: '0 0 32px ' + s.glow,
      discFlip: flipped ? 'rotateY(180deg)' : 'rotateY(0deg)',
      frontOpacity: flipped ? '0' : '1',
      backOpacity: flipped ? '1' : '0',
      dimOpacity: flipped ? '0.16' : '0',
      isCheck: s.mark === 'check',
      isBang: s.mark === 'bang',
      isX: s.mark === 'x',
      primary: s.primary,
      primarySize: s.size,
      caption: s.caption,
      residual: s.residual,
      predicted: s.predicted,
      total: s.total,
      chartOpen: chartOpen,
      chevron: chartOpen ? 'rotate(90deg)' : 'rotate(0deg)',
      toggleFlip: function () { self.setState({ flipped: !flipped }); },
      toggleChart: function () { self.setState({ chartOpen: !chartOpen }); }
    };
  }
}
</script>
